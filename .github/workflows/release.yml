name: "Create Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Package Release Bundle"
        run: |
          mkdir -p dist
          # Package ready-to-use EFI and tools
          zip -r "dist/Universal-AlderLake-IrisXe-${{ github.ref_name }}-EFI.zip" EFI/ tools/ scripts/ docs/ README.md LICENSE
          cd dist
          shasum -a 256 "Universal-AlderLake-IrisXe-${{ github.ref_name }}-EFI.zip" > sha256_checksums.txt
          cat sha256_checksums.txt

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "Universal Alder Lake & Iris Xe OpenCore ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Universal Alder Lake & Iris Xe OpenCore ${{ github.ref_name }}

            The first universal, multi-brand OpenCore EFI framework and interactive CLI builder for running macOS on **Intel 12th Gen (Alder Lake)** and **13th Gen (Raptor Lake)** laptops with full **Metal 2 Intel Iris Xe Graphics (`0x46A8`)** hardware acceleration.

            ---

            ### ✨ Key Features & Highlights

            * **🍏 Full Iris Xe Metal 2 Graphics Acceleration:**
              * Powered by `WhateverXe.kext` (v0.7.0) with custom eDP display preservation (`-wex-edp-keep`).
              * Verified on **macOS Tahoe 26.x**, **macOS Sonoma 14.x**, and **macOS Ventura 13.x**.
            * **🎨 Sleek OpenCanopy Graphical Boot Picker:**
              * Preloaded **GoldenGate** high-resolution Apple, Windows, and recovery icons.
              * Full Touchpad & Mouse pointer navigation support.
              * Clean boot screen (`HideAuxiliary: True`): Press **Spacebar** to reveal Reset NVRAM and diagnostics.
            * **💻 Multi-OEM Dynamic Configurator (`tools/alderlake-builder.py`):**
              * Zero-dependency Python CLI generator with tailored presets for **Dell, HP, Lenovo, and Asus**.
              * Automatic ACPI patch toggling, brand-specific trackpad gating, and audio ALCID selection.
            * **🛡️ Hardened & Audited:**
              * 100% CI-validated OpenCore configurations (`plutil -lint`).
              * Post-install stability suite (`scripts/post-install.sh`) for Wi-Fi LinkQuality tuning, hibernation disabling, and battery optimization.

            ---

            ### 📦 Included Assets
            * `Universal-AlderLake-IrisXe-${{ github.ref_name }}-EFI.zip`: Complete EFI bundle with ACPI SSDTs, Kexts, OpenCanopy resources, and CLI builder.
            * `sha256_checksums.txt`: SHA-256 verification hash.

            ---

            ### 🛠️ Quick Installation Guide
            1. Download `Universal-AlderLake-IrisXe-${{ github.ref_name }}-EFI.zip` below and unzip it.
            2. Run the interactive configurator to tailor the EFI for your laptop model:
               ```bash
               python3 tools/alderlake-builder.py
               ```
            3. Generate your SMBIOS using [GenSMBIOS](https://github.com/corpnewt/GenSMBIOS) with model `MacBookPro16,2`.
            4. Copy the generated `EFI` folder to the root of your USB EFI partition.
            5. Boot into the OpenCore picker and begin macOS installation!
          files: |
            dist/Universal-AlderLake-IrisXe-${{ github.ref_name }}-EFI.zip
            dist/sha256_checksums.txt
